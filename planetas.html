<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Atlas Planetario: sistema solar 3D interactivo con datos de cada planeta.">
<style>html{color-scheme:dark}body{margin:0}</style>
<title>Atlas Planetario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: escena 3D a pantalla completa con ficha de vidrio a la derecha (hoja inferior en móvil) y selector de planetas en un dock flotante. */
:root{
  --bg:#03050c; --glass:rgba(9,13,28,.74); --ink:#eaf0ff; --dim:#8d9bbd; --line:rgba(160,180,255,.17); --acc:#ffb347;
  --display:'Unbounded','Trebuchet MS',sans-serif; --body:'Bricolage Grotesque',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --pw:392px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}

.brand{position:fixed;left:20px;top:calc(18px + env(safe-area-inset-top,0px));z-index:5;pointer-events:none}
.brand b{display:block;font:700 .95rem var(--display);letter-spacing:.16em}
.brand span{font:500 .7rem var(--mono);color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.ctl{position:fixed;left:20px;top:calc(78px + env(safe-area-inset-top,0px));z-index:5;display:grid;gap:10px;padding:12px 14px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;width:min(230px,calc(100vw - 40px))}
.ctl label{display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.ctl input[type=range]{width:100%;accent-color:var(--acc)}
.tg{display:flex;gap:6px;flex-wrap:wrap}
.tg button{font:500 .72rem var(--mono);letter-spacing:.06em;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--dim)}
.tg button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#05070f}
.hint{position:fixed;left:20px;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:5;font:500 .72rem var(--mono);color:var(--dim);letter-spacing:.06em;pointer-events:none;max-width:calc(100vw - var(--pw) - 60px)}

#labels{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
#labels button{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;background:rgba(5,8,18,.6);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font:500 .72rem var(--mono);letter-spacing:.08em;color:var(--ink);white-space:nowrap;opacity:.85;will-change:transform}
#labels button.on{border-color:var(--acc);color:var(--acc);opacity:1}
#labels.off{display:none}

.dock{position:fixed;left:20px;right:calc(var(--pw) + 40px);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:8px;overflow-x:auto;padding:8px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;scrollbar-width:thin}
.dock button{flex:none;display:grid;justify-items:center;gap:4px;min-width:68px;padding:8px 6px 6px;background:transparent;border:1px solid transparent;border-radius:12px;font:500 .7rem var(--mono);letter-spacing:.06em;color:var(--dim)}
.dock button img{width:38px;height:38px;border-radius:50%;display:block}
.dock button:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.dock button[aria-current=true]{border-color:var(--ac);color:var(--ink);background:rgba(255,255,255,.06)}

#panel{position:fixed;z-index:7;right:16px;top:calc(16px + env(safe-area-inset-top,0px));bottom:16px;width:var(--pw);overflow:auto;padding:26px 24px 24px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;scrollbar-width:thin}
#panel .tag{font:700 .68rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
#panel h1{font:700 2.1rem/1.05 var(--display);margin:8px 0 6px}
#panel .tl{color:var(--dim);margin:0 0 18px}
#panel p{margin:0 0 12px}
#panel h3{font:700 .68rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px}
.fade{animation:fade .45s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0}
.stats div{background:rgba(7,10,22,.9);padding:10px 12px;min-width:0}
.stats dt{font:500 .66rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.stats dd{margin:2px 0 0;font:600 .9rem/1.3 var(--body);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cmp{display:grid;gap:12px}
.cmp .row{display:grid;gap:5px}
.cmp .rh{display:flex;justify-content:space-between;font:500 .75rem var(--mono);color:var(--dim)}
.cmp .rh b{color:var(--ink)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.wt{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
.wt label{font-size:.85rem;color:var(--dim)}
.wt input{width:92px;padding:8px 10px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:600 1rem var(--mono);text-align:right}
.wt output{grid-column:1/-1;font:700 1.5rem var(--display);color:var(--acc)}
.wt output small{font:500 .78rem var(--body);color:var(--dim);display:block;margin-top:2px}
#panel ul{margin:0;padding-left:18px}
#panel li{margin-bottom:8px}
.pn{display:flex;gap:8px;margin-top:22px}
.pn button{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font:500 .8rem var(--mono);letter-spacing:.04em}
.pn button:hover{border-color:var(--acc);color:var(--acc)}
.legend{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.legend li{display:flex;gap:10px;align-items:center;margin:0}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.note{font-size:.78rem;color:var(--dim)}

#load{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;align-content:center;gap:16px;text-align:center;transition:opacity .6s}
#load.gone{opacity:0;pointer-events:none}
#load b{font:700 1rem var(--display);letter-spacing:.2em}
#load span{font:500 .75rem var(--mono);color:var(--dim)}
.ring{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);border-top-color:#ffb347;animation:spin 1s linear infinite;margin-inline:auto}
@keyframes spin{to{transform:rotate(360deg)}}
.nogl{display:none;position:fixed;inset:0;z-index:15;place-items:center;text-align:center;padding:24px;background:var(--bg)}

@media(max-width:860px){
  :root{--pw:100vw}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;height:46vh;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
  #panel h1{font-size:1.6rem}
  .dock{left:8px;right:8px;top:calc(56px + env(safe-area-inset-top,0px));bottom:auto;padding:6px}
  .dock button{min-width:60px}
  .dock button img{width:30px;height:30px}
  .brand{left:14px;top:calc(14px + env(safe-area-inset-top,0px))}
  .ctl,.hint{display:none}
  .stats{grid-template-columns:1fr 1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* bucle */
var clock=new THREE.Clock(),v3=new THREE.Vector3();
function frame(){
  var dt=Math.min(clock.getDelta(),.1);
  bodies.forEach(function(b){
    if(!b)return;
    b.mesh.rotation.y+=b.sp*dt*(timeScale>0?Math.min(timeScale,3):0.4);
    if(b.clouds)b.clouds.rotation.y+=b.sp*dt*1.25*Math.min(timeScale||.4,3);
    if(b.i>0){b.ang+=b.w*dt*timeScale;place(b);}
    if(b.glow){var k=1+Math.sin(performance.now()/900)*.03;b.glow.scale.set(P[0].r*7.5*k,P[0].r*7.5*k,1);}
  });
  if(!S.drag&&sel<0&&!REDUCED)S.th+=dt*.035;
  var f=1-Math.exp(-dt*3.2);
  if(sel>=0)S.want.copy(bodies[sel].orbit.position);else S.want.set(0,0,0);
  S.tgt.lerp(S.want,1-Math.exp(-dt*(sel>=0?7:3)));
  S.dist+=(S.dd-S.dist)*f;
  cam.position.set(S.tgt.x+S.dist*Math.sin(S.ph)*Math.cos(S.th),S.tgt.y+S.dist*Math.cos(S.ph),S.tgt.z+S.dist*Math.sin(S.ph)*Math.sin(S.th));
  cam.lookAt(S.tgt);
  var W=window.innerWidth,H=window.innerHeight,mob=window.matchMedia('(max-width:860px)').matches,offx=mob?0:204,offy=mob?H*.23:0;
  bodies.forEach(function(b,k){
    var l=labels[k];if(!l||!showLab)return;
    v3.copy(b.orbit.position);v3.y+=P[k].r*1.25+(k===0?1:.3);v3.project(cam);
    var vis=v3.z<1&&Math.abs(v3.x)<1.2&&Math.abs(v3.y)<1.2&&(sel<0||k!==sel);
    l.style.display=vis?'block':'none';
    if(vis)l.style.transform='translate('+((v3.x*.5+.5)*W-offx)+'px,'+((-v3.y*.5+.5)*H-offy)+'px) translate(-50%,-100%)';
  });
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}

var order=P.map(function(p){return p.id;}),k0=0;
function step(){
  if(k0<order.length){
    var id=order[k0],c=paint(TEX[id],id==='sol'?512:640,id==='sol'?256:320);
    thumbs[k0]=thumb(c);buildBody(k0,c);
    $('loadt').textContent='Generando '+P[k0].n+'…';k0++;setTimeout(step,0);
  }else{finish();}
}

  var dk=$('dock'),lb=$('labels');
