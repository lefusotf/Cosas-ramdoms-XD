<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Balatro Hub Wiki: jokers, cartas, cupones, ciegas y mecanicas en espanol.">
<style>html{color-scheme:dark}body{margin:0}</style>
<title>Balatro Hub Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&family=JetBrains+Mono:wght@500;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: wiki de tres zonas. Barra superior con buscador, navegación lateral por categorías y artículo con infobox flotante a la derecha. */
:root{
  --bg:#08201c; --bg-2:#0c2924; --panel:#11362f; --panel-2:#17463c; --line:#2b5c50;
  --ink:#f4ecd8; --ink-dim:#a6c0b4; --red:#ff5a52; --blue:#3a97ff; --gold:#f5be4f; --ok:#6ee7a0;
  --card:#f6efde; --card-ink:#1b1b22; --suit-red:#c9303b;
  --display:'Pixelify Sans','Courier New',monospace;
  --body:'Bricolage Grotesque',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.1;text-wrap:balance}
p{margin:0 0 14px}
a{color:var(--blue);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
img{image-rendering:pixelated}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:14px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font:700 1.15rem var(--display);letter-spacing:.04em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo i{width:20px;height:28px;background:var(--card);border-radius:4px;display:grid;place-items:center;color:var(--suit-red);font:700 13px var(--display);font-style:normal;transform:rotate(-8deg);box-shadow:2px 2px 0 #000}
.logo b{color:var(--gold)}
#menu{display:none;background:var(--panel);color:var(--ink);border:2px solid #000;border-radius:8px;width:40px;height:40px;font-size:1.2rem;cursor:pointer}
.search{position:relative;flex:1;max-width:560px;margin-left:auto}
#q{width:100%;padding:10px 14px;background:var(--panel);color:var(--ink);border:2px solid #000;border-radius:10px;font:500 .95rem var(--body)}
#q::placeholder{color:var(--ink-dim)}
#res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:2px solid #000;border-radius:12px;box-shadow:0 8px 0 rgba(0,0,0,.5);max-height:min(70vh,520px);overflow:auto;display:none}
#res.on{display:block}
#res a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
#res a:last-child{border-bottom:0}
#res a:hover,#res a.sel{background:var(--panel-2)}
#res small{color:var(--ink-dim);grid-column:1/-1;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#res em{font:700 .65rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-style:normal;align-self:center}
#res p{padding:14px;color:var(--ink-dim);margin:0}

/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);max-width:1320px;margin-inline:auto}
#side{position:sticky;top:calc(61px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 61px);overflow:auto;padding:22px 12px 40px 16px;border-right:1px solid var(--line)}
#side h4{margin:18px 10px 6px;font:700 .68rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
#side h4:first-child{margin-top:0}
#side a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.93rem}
#side a:hover{background:var(--panel)}
#side a[aria-current=page]{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--gold);font-weight:600}
#side a span{font:500 .72rem var(--mono);color:var(--ink-dim)}
#main{padding:clamp(20px,4vw,44px) clamp(16px,4vw,48px) 80px;min-width:0}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  #menu{display:block}
  #side{position:fixed;left:0;top:calc(61px + env(safe-area-inset-top,0px));bottom:0;width:min(300px,86vw);height:auto;background:var(--bg);z-index:25;transform:translateX(-102%);transition:transform .2s;border-right:2px solid #000;box-shadow:8px 0 0 rgba(0,0,0,.4)}
  body.nav #side{transform:none}
  .logo b{display:none}
}

/* article */
.art{max-width:980px}
.crumb{font:500 .78rem var(--mono);color:var(--ink-dim);margin-bottom:10px}
.crumb a{color:var(--ink-dim)}
.art h1{font-size:clamp(2rem,5vw,3rem);margin-bottom:6px}
.sub{color:var(--ink-dim);font-size:1.02rem;margin-bottom:22px}
.lead{font-size:1.1rem}
.body h2{font-size:1.65rem;margin:38px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.body h3{font-size:1.2rem;margin:24px 0 8px}
.body ul,.body ol{padding-left:22px;margin:0 0 14px}
.body li{margin-bottom:5px}
.body code{font:500 .88em var(--mono);background:var(--panel);padding:1px 6px;border-radius:4px}
.info{float:right;width:min(310px,100%);margin:0 0 20px 28px;background:var(--panel);border:2px solid #000;border-radius:12px;box-shadow:0 4px 0 #000;overflow:hidden}
.info h3{margin:0;padding:12px 14px;background:var(--panel-2);font-size:1.15rem;text-align:center}
.info .pic{display:grid;place-items:center;padding:18px;background:repeating-linear-gradient(135deg,var(--a,#17463c) 0 12px,var(--b,#11362f) 12px 24px)}
.info .pic img{width:132px;height:132px;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.45))}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;padding:14px;font-size:.9rem}
.info dt{color:var(--ink-dim)}.info dd{margin:0;font-weight:600;text-align:right}
@media(max-width:700px){.info{float:none;width:100%;margin:0 0 20px}}
#toc{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:0 0 22px;display:inline-block;min-width:min(260px,100%)}
#toc:empty{display:none}
#toc b{display:block;font:700 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
#toc ol{margin:0;padding-left:20px;font-size:.93rem}
.tw{overflow-x:auto;border:2px solid #000;border-radius:12px;background:var(--panel);margin:0 0 18px;clear:both}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);background:var(--panel-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--panel-2) 55%,transparent)}
tr.hl td{background:color-mix(in srgb,var(--gold) 22%,transparent)}
td.n{font:500 .88rem var(--mono);white-space:nowrap}
.c{color:var(--blue);font-weight:700}.m{color:var(--red);font-weight:700}.g{color:var(--gold);font-weight:700}
td img.ji{width:36px;height:36px;display:block}
td .nm{font-weight:700;color:var(--ink);text-decoration:none}
td .nm:hover{text-decoration:underline}
.rar{font:700 .64rem var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid #000;white-space:nowrap;display:inline-block}
.rC{background:#7fb3ff;color:#001a3a}.rU{background:#6ee7a0;color:#00281a}.rR{background:#ff7a72;color:#3a0300}.rL{background:#c9a0ff;color:#240047}
.pill{display:inline-block;font:600 .74rem var(--mono);padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);margin:0 4px 4px 0;color:var(--ink-dim)}
.warn{background:#3b3216;border:2px solid #000;border-left:6px solid var(--gold);border-radius:10px;padding:12px 16px;margin:0 0 20px;font-size:.93rem}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
.tools input[type=search],.tools select,select{padding:9px 12px;background:var(--bg);color:var(--ink);border:2px solid #000;border-radius:8px;font:500 .95rem var(--body)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:700 .78rem var(--mono);padding:8px 13px;border-radius:999px;border:2px solid #000;background:var(--panel);color:var(--ink);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--gold);color:#000}
.count{font:500 .85rem var(--mono);color:var(--ink-dim);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:18px;clear:both}
.tile{background:var(--panel);border:2px solid #000;border-radius:12px;padding:14px;box-shadow:0 4px 0 #000;display:grid;gap:8px;align-content:start;position:relative}
.tile.hl{outline:3px solid var(--gold)}
.tile h3{font-size:1.05rem;margin:0}
.tile p{margin:0;font-size:.88rem;color:var(--ink-dim);line-height:1.5}
.tile .pic{height:84px;display:grid;place-items:center;border-radius:8px;background:var(--bg)}
.tile .pic img{height:72px;width:72px}
.tile .pic img.deck{width:52px;height:74px;transform:rotate(-4deg);filter:drop-shadow(3px 3px 0 rgba(0,0,0,.5))}
.tile .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile .cost{font:700 .85rem var(--mono);color:var(--gold)}
.roman{width:100%;height:96px;border-radius:8px;border:2px solid #000;display:grid;place-items:center;font:700 2.2rem var(--display);color:#fff;text-shadow:3px 3px 0 #000;background:repeating-linear-gradient(135deg,var(--a) 0 10px,var(--b) 10px 20px)}
.chip{display:inline-block;width:22px;height:22px;border-radius:50%;border:3px dashed rgba(255,255,255,.7);outline:2px solid #000;vertical-align:middle;margin-right:8px}
.pc{width:72px;aspect-ratio:5/7;border:2px solid #000;border-radius:8px;display:grid;place-items:center;font:700 1.5rem var(--display);color:var(--card-ink);box-shadow:3px 3px 0 rgba(0,0,0,.5);background:var(--card)}
.pc.red{color:var(--suit-red)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:18px}
.sw{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--panel);border:2px solid #000;border-radius:12px;padding:14px;box-shadow:0 4px 0 #000}
.sw h3{margin:0 0 3px;font-size:1.05rem}.sw p{margin:0;font-size:.88rem;color:var(--ink-dim);line-height:1.45}
.e-bonus{background:linear-gradient(#cfe3ff,#6fa8ff)}.e-mult{background:linear-gradient(#ffd0cc,#ff6f66)}
.e-wild{background:conic-gradient(#ff6f66,#f5be4f,#6ee7a0,#3a97ff,#c9a0ff,#ff6f66)}
.e-glass{background:linear-gradient(135deg,#e8fbff,#9fd8ee 40%,#e8fbff 60%,#9fd8ee);opacity:.92}
.e-steel{background:linear-gradient(135deg,#d7dde6,#7f8a9b)}.e-stone{background:repeating-linear-gradient(45deg,#8c8c94 0 6px,#6f6f78 6px 12px)}
.e-gold{background:linear-gradient(135deg,#ffe38a,#d9a31f)}.e-lucky{background:linear-gradient(135deg,#bff0cf,#47b97d)}
.e-foil{background:linear-gradient(120deg,#f6efde,#bcd7ff,#f6efde)}.e-holo{background:linear-gradient(120deg,#ffd0f2,#bdd1ff,#ffd0f2)}
.e-poly{background:linear-gradient(120deg,#ffb3b3,#ffe3a1,#b9f5c5,#a9c9ff,#d9b3ff)}.e-neg{background:#15151b;color:#fff!important}
.seal{width:22px;height:22px;border-radius:50%;border:2px solid #000;display:block}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin-bottom:12px}
.pair .arrow{align-self:center;font:700 1.4rem var(--display);color:var(--gold)}
.pair .tile{box-shadow:0 3px 0 #000}
@media(max-width:700px){.pair{grid-template-columns:1fr}.pair .arrow{transform:rotate(90deg);justify-self:center}}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.rel a{display:flex;align-items:center;gap:10px;padding:10px;background:var(--panel);border:2px solid #000;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600}
.rel img{width:36px;height:36px}

/* portal */
.hero{position:relative;overflow:hidden;border:2px solid #000;border-radius:16px;box-shadow:0 6px 0 #000;margin-bottom:28px}
#swirl{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,32,28,.94),rgba(8,32,28,.55) 60%,rgba(8,32,28,.3))}
.hero>div{position:relative;z-index:1;padding:clamp(22px,4vw,44px)}
.hero h1{font-size:clamp(2.2rem,6vw,3.8rem);margin-bottom:12px}
.hero h1 em{font-style:normal;color:var(--red);text-shadow:3px 3px 0 #000}
.hero p{max-width:52ch;font-size:1.08rem}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:18px}
.facts b{font:700 1.8rem var(--display);color:var(--gold);display:block;line-height:1}
.facts span{font:500 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:30px}
.cat{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:14px;background:var(--panel);border:2px solid #000;border-radius:12px;box-shadow:0 4px 0 #000;text-decoration:none;color:var(--ink);transition:transform .1s}
.cat:hover{transform:translateY(-2px)}
.cat .ico{width:56px;height:56px;border-radius:10px;border:2px solid #000;display:grid;place-items:center;font:700 1.6rem var(--display);color:#fff;text-shadow:2px 2px 0 #000}
.cat .ico img{width:44px;height:44px}
.cat b{display:block;font:700 1.05rem var(--display)}
.cat span{font-size:.85rem;color:var(--ink-dim);line-height:1.35;display:block}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:22px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.box{background:var(--panel);border:2px solid #000;border-radius:12px;padding:18px 20px;box-shadow:0 4px 0 #000}
.box h2{font-size:1.3rem;margin-bottom:10px;border:0;padding:0}
.box ul{margin:0;padding-left:20px}
.box li{margin-bottom:6px;font-size:.95rem}

/* simulator */
.sim{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;clear:both}
@media(max-width:900px){.sim{grid-template-columns:1fr}}
.ctrl{display:grid;gap:16px}
.ctrl label,.ctrl .lbl{display:flex;justify-content:space-between;gap:10px;font:700 .75rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px}
.ctrl output{color:var(--gold)}
.ctrl select{width:100%}
input[type=range]{width:100%;accent-color:var(--red);height:26px}
.pal{display:flex;flex-wrap:wrap;gap:8px}
.pal button{font:600 .82rem var(--body);padding:7px 11px;border-radius:8px;border:2px solid #000;background:var(--panel-2);color:var(--ink);cursor:pointer}
.pal button small{display:block;font:500 .66rem var(--mono);color:var(--ink-dim)}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.slot{min-height:88px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;padding:6px;font-size:.7rem;color:var(--ink-dim);text-align:center}
.slot.full{border:2px solid #000;background:var(--panel-2);color:var(--ink);grid-template-rows:1fr auto;gap:4px}
.slot .jn{font:700 .78rem/1.1 var(--display)}.slot .jd{font:500 .62rem var(--mono);color:var(--gold);display:block;margin-top:3px}
.slot .mv{display:flex;gap:2px;width:100%}
.slot .mv button{flex:1;background:var(--bg);color:var(--ink);border:1px solid #000;border-radius:4px;cursor:pointer;font:700 .75rem var(--mono);padding:2px 0}
.slot .mv button:disabled{opacity:.3}
@media(max-width:480px){.slots{grid-template-columns:repeat(3,1fr)}}
.board{background:#0b1e1b;border:2px solid #000;border-radius:14px;padding:20px;box-shadow:0 5px 0 #000;display:grid;gap:16px}
.calc{display:flex;justify-content:center;align-items:stretch;gap:8px}
.calc .box2{min-width:100px;padding:8px 14px;border:2px solid #000;border-radius:10px;font:700 2rem var(--mono);text-align:center;box-shadow:0 3px 0 #000;font-variant-numeric:tabular-nums;color:#fff}
.calc .chips2{background:var(--blue)}.calc .mult2{background:var(--red)}
.calc .x{align-self:center;font:700 1.4rem var(--display);color:var(--ink-dim)}
.big{text-align:center}.big small{font:500 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);display:block}
.big b{font:700 clamp(2.2rem,6vw,3.4rem) var(--mono);color:var(--gold);line-height:1.1;font-variant-numeric:tabular-nums}
.trace{margin:0;padding:0!important;list-style:none;display:grid;gap:6px;font:500 .78rem var(--mono)}
.trace li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 10px;background:var(--panel);border-radius:6px;border-left:4px solid var(--line);margin:0}
.trace li.c{border-left-color:var(--blue)}.trace li.m{border-left-color:var(--red)}.trace li.x{border-left-color:var(--gold)}
.trace li.skip{opacity:.5}.trace span{color:var(--ink-dim)}
.verdict{padding:12px 14px;border-radius:10px;border:2px solid #000;font-weight:600;display:grid;gap:8px}
.verdict.win{background:#12402b}.verdict.lose{background:#42191d}
.verdict .meter{height:10px;background:#000;border-radius:3px;overflow:hidden}.verdict .meter i{display:block;height:100%;background:var(--ok)}
.verdict.lose .meter i{background:var(--red)}
.hint{font-size:.82rem;color:var(--ink-dim);font-weight:400}
button.link{background:none;border:0;color:var(--blue);font:600 .85rem var(--body);cursor:pointer;text-decoration:underline;padding:0;justify-self:start}
.row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:480px){.row2{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding:28px 16px;color:var(--ink-dim);font-size:.82rem;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="top">
  <button id="menu" type="button" aria-label="Abrir menú de categorías" aria-expanded="false">☰</button>
  <a class="logo" href="#inicio"><i>♠</i>BALATRO HUB <b>WIKI</b></a>
  <div class="search">
    <input id="q" type="search" placeholder="Buscar jokers, cartas, cupones…  ( / )" autocomplete="off" aria-label="Buscar en la wiki" aria-controls="res">
    <div id="res" role="listbox"></div>
  </div>
</header>
<div class="shell">
  <nav id="side" aria-label="Categorías"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<footer>
  Wiki de fans sin afiliación oficial. Balatro es una marca de LocalThunk y Playstack. Las ilustraciones son pixel art original hecho para esta página, no el arte del juego.<br>
  Datos escritos a mano. Pueden contener errores: verifica en el juego antes de apoyarte en una cifra.
</footer>

<script>
(function(){
'use strict';
var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function $(id){return document.getElementById(id);}
function fmt(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function hsh(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

/* ================= DATOS ================= */
var RAR={C:'Común',U:'Poco común',R:'Rara',L:'Legendaria'};
var JRAW=[
'Joker|C|2|+4 de Mult.',
'Greedy Joker|C|5|Las cartas de Diamantes que puntúan dan +3 de Mult.',
'Lusty Joker|C|5|Las cartas de Corazones que puntúan dan +3 de Mult.',
'Wrathful Joker|C|5|Las cartas de Picas que puntúan dan +3 de Mult.',
'Gluttonous Joker|C|5|Las cartas de Tréboles que puntúan dan +3 de Mult.',

function initJokers(){

  $('clear').addEventListener('click',function(){order=[];run();});
  $('slots').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var i=+b.dataset.i,a=b.dataset.a;
    if(a==='x')order.splice(i,1);else if(a==='l'&&i>0){var t=order[i-1];order[i-1]=order[i];order[i]=t;}else if(a==='r'&&i<order.length-1){var u=order[i+1];order[i+1]=order[i];order[i]=u;}run();});
  function slots(){var h='';for(var i=0;i<5;i++){if(order[i]){var j=JK[order[i]];h+='<div class="slot full"><div><span class="jn">'+j[0]+'</span><span class="jd">'+j[1]+'</span></div><div class="mv"><button type="button" data-a="l" data-i="'+i+'" aria-label="Mover a la izquierda"'+(i===0?' disabled':'')+'>◀</button><button type="button" data-a="x" data-i="'+i+'" aria-label="Quitar">✕</button><button type="button" data-a="r" data-i="'+i+'" aria-label="Mover a la derecha"'+(i===order.length-1?' disabled':'')+'>▶</button></div></div>';}else h+='<div class="slot">Hueco '+(i+1)+'</div>';}$('slots').innerHTML=h;}
  function count(to){cancelAnimationFrame(raf);if(REDUCED){$('sT').textContent=fmt(to);shown=to;return;}var from=shown,t0=performance.now();(function step(n){var el=$('sT');if(!el)return;var k=Math.min(1,(n-t0)/420),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)raf=requestAnimationFrame(step);else shown=to;})(t0);}
  function run(){
    var h=HBY[hs.value],L=+lv.value,card=+cc.value;$('lvlo').textContent=L;$('cco').textContent=card;
    var chips=h.c+(L-1)*h.lc,mult=h.m+(L-1)*h.lm,tr='<li class="c"><b>'+h.n+' nv. '+L+'</b><span>'+chips+' × '+mult+'</span></li>';
    chips+=card;tr+='<li class="c"><b>Cartas que puntúan</b><span>+'+card+' fichas</span></li>';
    order.forEach(function(k){var j=JK[k],ok=!j[3]||(j[3]==='pair'?HAS_PAIR[h.id]:HAS_THREE[h.id]);
      if(!ok){tr+='<li class="skip"><b>'+j[0]+'</b><span>no se activa</span></li>';return;}
      if(j[2]==='m'){mult+=j[4];tr+='<li class="m"><b>'+j[0]+'</b><span>+'+j[4]+' mult → '+mult+'</span></li>';}
      else if(j[2]==='c'){chips+=j[4];tr+='<li class="c"><b>'+j[0]+'</b><span>+'+j[4]+' fichas → '+chips+'</span></li>';}
      else{mult*=j[4];tr+='<li class="x"><b>'+j[0]+'</b><span>×'+j[4]+' mult → '+mult+'</span></li>';}});
    var total=Math.floor(chips*mult);$('sC').textContent=fmt(chips);$('sM').textContent=fmt(mult);count(total);$('tr').innerHTML=tr;
    var target=BASE[+sk.value][+an.value]*parseFloat(bl.value),ok2=total>=target;
    var v=$('vd');v.className='verdict '+(ok2?'win':'lose');
    v.innerHTML='<span>'+(ok2?'Superas la ciega por '+fmt(total-target):'Te faltan '+fmt(target-total)+' puntos')+'</span><span class="hint num">Objetivo '+fmt(target)+' en una sola mano</span><span class="meter"><i style="width:'+Math.min(100,total/target*100)+'%"></i></span>';
    slots();
  }
  sk.addEventListener('change',function(){var cur=an.value;antes();an.value=cur;run();});
  [hs,lv,cc,an,bl].forEach(function(el){el.addEventListener('input',run);});
  run();
}

/* remolino del portal */
function swirl(){
  var cv=$('swirl');if(!cv)return;var ctx=cv.getContext('2d'),W=cv.width,H=cv.height,img=ctx.createImageData(W,H),d=img.data;
  var P=[[8,32,28],[14,58,50],[74,24,38],[20,56,104]],last=0;
  function frame(ts){
    if(!document.body.contains(cv))return;
    if(ts-last>50){last=ts;var t=ts/1000*.35,p=0;
      for(var y=0;y<H;y++)for(var x=0;x<W;x++){var ux=(x/W-.5)*3.4,uy=(y/H-.5)*1.5;
        for(var i=1;i<5;i++){var ox=ux;ux+=.5/i*Math.sin(i*uy+t+.3*i);uy+=.5/i*Math.cos(i*ox+t*.8+.3*i);}
        var v=Math.sin(ux*1.5+uy*1.5)+Math.sin(ux-uy*2),c=v<-1.1?P[1]:v<.1?P[0]:v<1.1?P[2]:P[3];d[p++]=c[0];d[p++]=c[1];d[p++]=c[2];d[p++]=255;}
      ctx.putImageData(img,0,0);}
    if(!REDUCED)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);if(REDUCED)setTimeout(function(){frame(100);},0);
}

/* ================= ROUTER ================= */
var pendingHL=null,INIT={jokers:initJokers,manos:initManos,simulador:initSim,inicio:swirl};
function buildToc(){
  var hs=document.querySelectorAll('.body h2[id]'),t=$('toc');if(!t)return;
  if(hs.length<3){t.remove();return;}
  var h='<b>Contenido</b><ol>';Array.prototype.forEach.call(hs,function(x){h+='<li><a href="#'+x.id+'" data-sec="'+x.id+'">'+x.textContent+'</a></li>';});t.innerHTML=h+'</ol>';
  t.addEventListener('click',function(e){var a=e.target.closest('a[data-sec]');if(!a)return;e.preventDefault();var el=document.getElementById(a.dataset.sec);if(el)el.scrollIntoView({behavior:REDUCED?'auto':'smooth'});});
}
function route(){
  var id=(location.hash||'#inicio').slice(1)||'inicio',html,page=id;
  if(JBY[id]){html=jokerPage(JBY[id]);page=id;}
  else if(PAGES[id]){html=PAGES[id]();}
  else{html=art({title:'Página no encontrada',body:'<p>No existe la página «'+id.replace(/[^a-z0-9-]/gi,'')+'». Prueba el buscador o vuelve al <a href="#inicio">inicio</a>.</p>'});id='inicio';}
  $('main').innerHTML=html;renderSide(page);document.body.classList.remove('nav');$('menu').setAttribute('aria-expanded','false');
  buildToc();if(INIT[page])INIT[page]();
  var t=JBY[page]?JBY[page].n:(PAGES[page]?(document.querySelector('.art h1')||{}).textContent:'');
  document.title=(t?t+' · ':'')+'Balatro Hub Wiki';
  window.scrollTo(0,0);
  if(pendingHL){var el=document.querySelector('[data-name="'+pendingHL.replace(/"/g,'\\"')+'"]');if(el){el.classList.add('hl');setTimeout(function(){el.scrollIntoView({block:'center',behavior:REDUCED?'auto':'smooth'});},60);}pendingHL=null;}
}
window.addEventListener('hashchange',route);
$('menu').addEventListener('click',function(){var on=document.body.classList.toggle('nav');this.setAttribute('aria-expanded',on);});

/* ================= BUSCADOR ================= */
var IDX=[];
JOKERS.forEach(function(j){IDX.push({n:j.n,cat:'Joker',page:j.id,t:j.e});});
HANDS.forEach(function(h){IDX.push({n:h.n,cat:'Mano',page:'manos',t:h.c+' fichas × '+h.m+' Mult'});IDX.push({n:h.p,cat:'Planeta',page:'planetas',t:'Sube '+h.n});});
TAROT.forEach(function(t){IDX.push({n:t[0],cat:'Tarot',page:'tarot',t:t[2]});});
SPEC.forEach(function(t){IDX.push({n:t[0],cat:'Espectral',page:'espectrales',t:t[1]});});
VOUCH.forEach(function(v){IDX.push({n:v[0],cat:'Cupón',page:'cupones',t:v[2]});IDX.push({n:v[1],cat:'Cupón',page:'cupones',t:v[3]});});
DECKS.forEach(function(d){IDX.push({n:d[0],cat:'Mazo',page:'mazos',t:d[1]});});
STAKES.forEach(function(s){IDX.push({n:'Stake '+s[0],cat:'Stake',page:'stakes',t:s[2]});});
BOSS.concat(FINAL).forEach(function(b){IDX.push({n:b[0],cat:'Jefe',page:'ciegas',t:b[1]});});
TAGS.forEach(function(t){IDX.push({n:t[0],cat:'Etiqueta',page:'etiquetas',t:t[1]});});
PACKS.forEach(function(p){IDX.push({n:p[0],cat:'Sobre',page:'sobres',t:p[1]});});
ENH.forEach(function(x){IDX.push({n:x[0],cat:'Mejora',page:'mejoras',t:x[2]});});
SEALS.forEach(function(x){IDX.push({n:x[0],cat:'Sello',page:'mejoras',t:x[2]});});
EDIT.forEach(function(x){IDX.push({n:x[0],cat:'Edición',page:'mejoras',t:x[2]});});
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
IDX.forEach(function(e){e.k=norm(e.n);e.kt=norm(e.t);});
var q=$('q'),res=$('res'),sel=-1,cur=[];
function find(v){
  v=norm(v.trim());if(!v)return[];
  var a=[],b=[];IDX.forEach(function(e){if(e.k.indexOf(v)===0||e.k.indexOf(' '+v)>-1)a.push(e);else if(e.k.indexOf(v)>-1||e.kt.indexOf(v)>-1)b.push(e);});
  return a.concat(b).slice(0,12);
}
function show(){
  cur=find(q.value);sel=-1;
  if(!q.value.trim()){res.className='';res.innerHTML='';return;}
  res.className='on';
  res.innerHTML=cur.length?cur.map(function(e,i){return '<a href="#'+e.page+'" data-i="'+i+'" role="option"><span><b>'+e.n+'</b></span><em>'+e.cat+'</em><small>'+e.t+'</small></a>';}).join(''):'<p>Sin resultados para «'+q.value.replace(/[<>&]/g,'')+'».</p>';
}
function go(e){pendingHL=(e.cat==='Joker')?null:e.n;q.value='';res.className='';location.hash=e.page;if(location.hash==='#'+e.page&&pendingHL)route();}
q.addEventListener('input',show);q.addEventListener('focus',show);
q.addEventListener('keydown',function(ev){
  var as=res.querySelectorAll('a');
  if(ev.key==='ArrowDown'&&as.length){ev.preventDefault();sel=(sel+1)%as.length;}
  else if(ev.key==='ArrowUp'&&as.length){ev.preventDefault();sel=(sel-1+as.length)%as.length;}
  else if(ev.key==='Enter'){var t=cur[sel<0?0:sel];if(t){ev.preventDefault();go(t);}return;}
  else if(ev.key==='Escape'){res.className='';q.blur();return;}
  else return;
  Array.prototype.forEach.call(as,function(a,i){a.classList.toggle('sel',i===sel);});
});
res.addEventListener('mousedown',function(ev){var a=ev.target.closest('a[data-i]');if(!a)return;ev.preventDefault();go(cur[+a.dataset.i]);});
document.addEventListener('click',function(ev){if(!ev.target.closest('.search'))res.className='';});
document.addEventListener('keydown',function(ev){if(ev.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='SELECT'){ev.preventDefault();q.focus();}});

route();
})();
</script>
